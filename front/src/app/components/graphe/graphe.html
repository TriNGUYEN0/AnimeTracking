<div class="graphe-layout">
  
  <div class="panneau-filtres">
    <h2>Explorateur d'Animes</h2>
    
    <label>Studio de production</label>
    <select [(ngModel)]="filtreStudio" (change)="appliquerFiltres()">
      <option value="Tous">Tous les studios</option>
      <option *ngFor="let s of studios" [value]="s">{{ s }}</option>
    </select>

    <label>Année de sortie</label>
    <select [(ngModel)]="filtreAnnee" (change)="appliquerFiltres()">
      <option value="Toutes">Toutes les années</option>
      <option *ngFor="let a of annees" [value]="a">{{ a }}</option>
    </select>
  </div>

  <div class="zone-graphe">
    <div #conteneurGraphe class="echarts-conteneur"></div>
  </div>

  <div class="modale-details" *ngIf="animeSelectionne">
    <button class="bouton-fermer" (click)="fermerDetails()">X</button>
    <img [src]="animeSelectionne.large_image_url || animeSelectionne.image_url" [alt]="animeSelectionne.titre" />
    <h3>{{ animeSelectionne.titre }}</h3>
    <p class="score">Score: {{ animeSelectionne.score }}</p>
    <p class="annee">Année: {{ animeSelectionne.annee }}</p>
    <div class="genres">
      <span *ngFor="let genre of animeSelectionne.genres" class="badge">{{ genre }}</span>
    </div>
    <p class="synopsis">{{ animeSelectionne.synopsis }}</p>
  </div>

</div>

<a class="card" [routerLink]="['/anime', anime.id]" (mouseenter)="loadSynopsis()" (focusin)="loadSynopsis()">
  @if (anime.rank) {
    <div class="rank">#{{ anime.rank }}</div>
  }

  <div class="image-container">
    <img [src]="posterUrl(anime)" [alt]="anime.title" loading="lazy" width="225" height="320" [style.view-transition-name]="'poster-' + anime.id" />
    <div class="overlay">
      <p class="synopsis">{{ synopsis() || 'Loading synopsis…' }}</p>
    </div>
  </div>

  <div class="info">
    <div class="header">
      <h3 [title]="anime.title">{{ anime.title || 'Unknown title' }}</h3>
      <span class="score">⭐ {{ anime.score || '–' }}</span>
    </div>

    <div class="meta">
      <span>📅 {{ anime.year || 'N/A' }}</span>
      <span>📺 {{ anime.episodes || '?' }} EPS</span>
    </div>

    <div class="genres">
      @for (genre of anime.genres.slice(0, 3); track genre) {
        <span class="badge">{{ genre }}</span>
      } @empty {
        <span class="badge">Unknown</span>
      }
    </div>
  </div>
</a>

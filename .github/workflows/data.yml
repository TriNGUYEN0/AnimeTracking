name: data

# Refreshes front/public/data from the Jikan API, commits it, then redeploys the site.
#  - every 6 hours: currently airing anime + broadcast schedule (~20 requests)
#  - whenever the catalogue was never crawled from Jikan or is older than 7 days:
#    the whole SFW catalogue too (~1,100 requests, ~20 min)
# Jikan allows 60 requests/minute; the crawler stays at ~55. If Jikan is down, nothing is committed.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/data.yml']

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r pipeline/requirements.txt

      - name: Crawl Jikan
        run: |
          set +e
          python pipeline/crawl.py --airing --catalogue-if-stale 7
          code=$?
          if [ $code -eq 2 ]; then
            echo "::warning::Jikan unreachable, previous data kept"
            exit 0
          fi
          exit $code

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add front/public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
